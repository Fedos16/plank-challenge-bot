name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

# деплои не пересекаются между собой
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # self-hosted раннер развёрнут прямо на сервере (challenge-vps): деплой локально, без SSH,
    # не зависит от GitHub-hosted минут/биллинга.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Pull latest and redeploy
        run: |
          set -e
          cd /opt/challenge
          git fetch --quiet origin main
          git reset --hard origin/main
          docker compose build app
          # Схему накатываем отдельным шагом ДО подмены контейнера. Если db push откажется
          # (например, уникальный индекс на колонку существующей таблицы), деплой упадёт
          # здесь, а старый контейнер продолжит работать — без рестарт-цикла на проде.
          docker compose run --rm app npx prisma db push --skip-generate
          docker compose up -d
          docker image prune -f
          # Кеш buildx не удаляется вместе с образами: за полтора месяца он вырос
          # до 7.8 ГБ на диске в 38 ГБ. Держим потолок, чтобы сборки оставались
          # быстрыми (свежие слои переиспользуются), а диск не заполнялся.
          docker builder prune -f --max-used-space 4GB
          docker compose ps
