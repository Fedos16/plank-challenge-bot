services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # api.telegram.org отвечает по IPv6, но не по IPv4 (см. networks ниже).
      # node-fetch берёт первый адрес из DNS, поэтому явно ставим IPv6 вперёд.
      NODE_OPTIONS: --dns-result-order=ipv6first
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-challenge}
      POSTGRES_DB: challenge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U challenge']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

# IPv4-маршрут от сервера до api.telegram.org не работает, IPv6 — работает. Поэтому
# контейнерам нужен IPv6. Адрес ULA-подсети зашит: по нему challenge-ipv6-snat.sh на хосте
# подменяет source-адрес на глобальный IPv6 сервера (штатный MASQUERADE этого не делает,
# так как адрес сервера помечен deprecated).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c0de:1::/64

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
