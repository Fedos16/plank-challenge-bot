services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-challenge}
      POSTGRES_DB: challenge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U challenge']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      # Веб-морда tennis (/opt/tennis, отдельный compose-проект): Caddy снимает TLS тем же
      # сертификатом, а логин и пароль проверяет nginx тенниса.
      - '8443:8443'
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    networks:
      default:
        # Маршрут по умолчанию остаётся в сети с IPv6, как до подключения edge.
        gw_priority: 1
      edge: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

# IPv4-маршрут от сервера до api.telegram.org не работает, IPv6 — работает. Поэтому
# контейнерам нужен IPv6 (сам бот включает его через TELEGRAM_IP_FAMILY=6 в .env).
# Адрес ULA-подсети зашит: по нему challenge-ipv6-snat.sh на хосте подменяет source-адрес
# на глобальный IPv6 сервера (штатный MASQUERADE этого не делает, так как адрес сервера
# помечен deprecated).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:c0de:1::/64
  # Общая сеть с проектом tennis: через неё Caddy достаёт до его nginx (tennis-nginx).
  # Создаётся здесь, чтобы бот не зависел от того, запущен ли tennis.
  edge:
    name: edge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
